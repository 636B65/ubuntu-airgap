version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Hash-locked CI lint tools (ruff, codespell, zizmor)
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    groups:
      lint-tools:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
