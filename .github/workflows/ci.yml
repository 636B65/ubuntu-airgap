name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    # Weekly run catches upstream changes (Ubuntu archive, debmirror, apt)
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main or tag runs: a run on main may be publishing a release
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  # Pinned tool versions. Python tools are hash-locked in
  # .github/requirements/lint.txt (kept current by Dependabot).
  MARKDOWNLINT_VERSION: "0.24.1"
  ACTIONLINT_IMAGE: "rhysd/actionlint:1.7.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Python linters
        run: pip install --require-hashes --no-deps -r .github/requirements/lint.txt

      # ShellCheck, bash -n, ruff, codespell, actionlint, markdownlint: the same
      # script developers run locally (zizmor has its own job below)
      - name: Lint
        run: tests/lint.sh

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Run zizmor
        run: |
          pip install --require-hashes --no-deps -r .github/requirements/lint.txt
          zizmor --format plain .github/workflows/
          zizmor --format sarif .github/workflows/ > zizmor.sarif || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload SARIF
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: CLI tests
        run: tests/test_cli.sh
      - name: Python helper tests
        run: python3 -W error -m unittest discover -s tests -v

  e2e:
    name: End-to-end (${{ matrix.variant }})
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [amd64, amd64v3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show CPU level
        run: |
          grep -m1 'model name' /proc/cpuinfo
          for f in avx2 bmi2 fma; do grep -qw "$f" /proc/cpuinfo && echo "$f: yes" || echo "$f: no"; done
      - name: Partial mirror + offline upgrade
        env:
          AMD64V3: ${{ matrix.variant == 'amd64v3' && '1' || '0' }}
          WORK: ${{ runner.temp }}/e2e
        run: tests/e2e.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/mirror/airgap-mirror.conf
          if-no-files-found: ignore

  e2e-snap:
    name: End-to-end (snaps)
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: --snap download + offline install (systemd/snapd container, network disconnected)
        env:
          WORK: ${{ runner.temp }}/e2e-snap
        run: tests/e2e-snap.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-snap-logs
          path: |
            ${{ runner.temp }}/e2e-snap/*.log
            ${{ runner.temp }}/e2e-snap/mirror/airgap-mirror.conf
          if-no-files-found: ignore

  # After a green push to main: if VERSION in the script has no tag yet, tag
  # that commit and publish the release. To release, bump VERSION + CHANGELOG.
  release:
    name: Release (if VERSION is new)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, zizmor, unit, e2e, e2e-snap]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the tag and the release
      id-token: write       # sign the build provenance attestation
      attestations: write   # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is VERSION new?
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sed -n 's/^VERSION="\(.*\)"$/\1/p' ubuntu-airgap.sh)"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists: nothing to release"
          else
            echo "$tag is new: releasing"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      - name: Check, test and build
        if: steps.v.outputs.tag != ''
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: .github/release.sh build "$TAG"
      - name: Attest build provenance (Sigstore-signed)
        if: steps.v.outputs.tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/assets/*
      - name: Publish
        if: steps.v.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: .github/release.sh publish "$TAG"
