name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    # Weekly run catches upstream changes (Ubuntu archive, debmirror, apt)
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned tool versions. Python tools are hash-locked in
  # .github/requirements/lint.txt (kept current by Dependabot).
  MARKDOWNLINT_VERSION: "0.24.1"
  ACTIONLINT_IMAGE: "rhysd/actionlint:1.7.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck -x ubuntu-airgap.sh tests/*.sh

      - name: Bash syntax
        run: |
          for f in ubuntu-airgap.sh tests/*.sh airgap.conf.example; do bash -n "$f"; done

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Python linters
        run: pip install --require-hashes --no-deps -r .github/requirements/lint.txt

      - name: Ruff (embedded Python helper + tests)
        run: |
          tests/extract-helper.sh tests/.airgap_helper_lint.py
          ruff check --output-format github tests/

      - name: Codespell
        run: codespell

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

      - name: Markdown lint
        run: npx --yes "markdownlint-cli2@${MARKDOWNLINT_VERSION}" "**/*.md"

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Run zizmor
        run: |
          pip install --require-hashes --no-deps -r .github/requirements/lint.txt
          zizmor --format plain .github/workflows/
          zizmor --format sarif .github/workflows/ > zizmor.sarif || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload SARIF
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: CLI tests
        run: tests/test_cli.sh
      - name: Python helper tests
        run: python3 -W error -m unittest discover -s tests -v

  e2e:
    name: End-to-end (${{ matrix.variant }})
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [amd64, amd64v3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show CPU level
        run: |
          grep -m1 'model name' /proc/cpuinfo
          for f in avx2 bmi2 fma; do grep -qw "$f" /proc/cpuinfo && echo "$f: yes" || echo "$f: no"; done
      - name: Partial mirror + offline upgrade
        env:
          AMD64V3: ${{ matrix.variant == 'amd64v3' && '1' || '0' }}
          WORK: ${{ runner.temp }}/e2e
        run: tests/e2e.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/mirror/airgap-mirror.conf
          if-no-files-found: ignore

  e2e-snap:
    name: End-to-end (snaps)
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: --snap download + offline install (systemd/snapd container, network disconnected)
        env:
          WORK: ${{ runner.temp }}/e2e-snap
        run: tests/e2e-snap.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-snap-logs
          path: |
            ${{ runner.temp }}/e2e-snap/*.log
            ${{ runner.temp }}/e2e-snap/mirror/airgap-mirror.conf
          if-no-files-found: ignore
