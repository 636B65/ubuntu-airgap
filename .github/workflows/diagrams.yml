name: Diagrams

# Renders docs/diagrams/*.drawio to PNG (shown in README.md).
# On main the PNGs are committed back; on pull requests they are uploaded as an
# artifact so the change can be reviewed.

on:
  push:
    branches: [main]
    paths: ["docs/diagrams/**.drawio", ".github/workflows/diagrams.yml"]
  pull_request:
    paths: ["docs/diagrams/**.drawio", ".github/workflows/diagrams.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagrams-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: drawio → png
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the rendered PNGs back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export with draw.io
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/docs/diagrams:/data" \
            rlespinasse/drawio-export:v4.60.0 \
            --format png --output . --remove-page-suffix --border 20 --scale 1.5
          ls -l docs/diagrams

      - name: Upload PNGs (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagrams
          path: docs/diagrams/*.png

      - name: Commit updated PNGs (main)
        if: github.event_name != 'pull_request'
        run: |
          git add docs/diagrams/*.png
          if git diff --cached --quiet; then
            echo "Diagrams are up to date"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: render architecture diagrams [skip ci]"
          # credentials are not persisted by checkout; pass the token only here
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "HEAD:${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
