name: Release

# A tag pushed by a person. CI publishes releases itself after a green push to
# main whose VERSION has no tag yet (see the release job in ci.yml).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check, test and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/release.sh "$GITHUB_REF_NAME"
